# XRFlow Softphone Hub — public enroll/heartbeat API
# Debian 12 / FreePBX 17 (apache2). Do not point this at eth0 SIP/WSS.
Alias /xrflow-hub /var/www/html/admin/modules/xrflowsoftphone/public
<Directory /var/www/html/admin/modules/xrflowsoftphone/public>
	Options -Indexes +FollowSymLinks
	AllowOverride None
	Require all granted
</Directory>
